version: "3"

services:
  mysql:
    image: mysql:5.7
    container_name: yunshu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Yunshu@2024!
      MYSQL_DATABASE: yunshu_oa
      MYSQL_USER: yunshu_app
      MYSQL_PASSWORD: Yunshu@2024!
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - yunshu-db:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pYunshu@2024!"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: yunshu-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: yunshu_oa
      DB_USER: yunshu_app
      DB_PASS: Yunshu@2024!
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - yunshu-upload:/app/static/upload
      - yunshu-attach:/app/data/attach

volumes:
  yunshu-db:
  yunshu-upload:
  yunshu-attach:
