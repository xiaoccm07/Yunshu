server:
  port: 8080
  servlet:
    session:
      timeout: 30m

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:yunshu_oa}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:yunshu_app}
    password: ${DB_PASS:Yunshu@2024!}
    initial-size: 5
    min-idle: 5
    max-active: 20
  freemarker:
    suffix: .ftl
    cache: false
    charset: UTF-8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.yunshu.oa.entity
  configuration:
    map-underscore-to-camel-case: true

yunshu:
  jwt-secret: yunshu123
  upload-dir: ./static/upload
  attach-dir: ./data/attach
  admin-default-password: 123456
