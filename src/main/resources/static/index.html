<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云枢管理系统</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",sans-serif; background:#f0f2f5; height:100vh; display:flex; align-items:center; justify-content:center; }
  .login-box { background:#fff; padding:40px 36px; border-radius:8px; box-shadow:0 2px 12px rgba(0,0,0,.08); width:360px; }
  .login-box h1 { font-size:22px; color:#1f2d3d; text-align:center; margin-bottom:6px; }
  .login-box p.sub { text-align:center; color:#909399; font-size:13px; margin-bottom:28px; }
  .field { margin-bottom:16px; }
  .field input { width:100%; padding:11px 12px; border:1px solid #dcdfe6; border-radius:4px; font-size:14px; outline:none; }
  .field input:focus { border-color:#409eff; }
  button { width:100%; padding:11px; background:#409eff; color:#fff; border:none; border-radius:4px; font-size:15px; cursor:pointer; }
  button:hover { background:#66b1ff; }
  #msg { margin-top:14px; font-size:13px; color:#f56c6c; text-align:center; min-height:18px; }
  #panel { display:none; }
  #panel .welcome { font-size:15px; color:#303133; margin-bottom:12px; }
  #panel pre { background:#f5f7fa; padding:10px; border-radius:4px; font-size:12px; max-height:220px; overflow:auto; white-space:pre-wrap; word-break:break-all; }
</style>
</head>
<body>
<div class="login-box">
  <h1>云枢管理系统</h1>
  <p class="sub">Yunshu OA v2.3.0</p>
  <div id="loginForm">
    <div class="field"><input id="account" placeholder="账号" autocomplete="username"></div>
    <div class="field"><input id="pwd" type="password" placeholder="密码" autocomplete="current-password"></div>
    <button onclick="doLogin()">登 录</button>
    <div id="msg"></div>
  </div>
  <div id="panel">
    <div class="welcome">欢迎，<span id="nickname"></span></div>
    <pre id="tokenBox"></pre>
    <button style="margin-top:12px;background:#909399" onclick="logout()">退出登录</button>
  </div>
</div>
<script>
function doLogin() {
  var account = document.getElementById('account').value.trim();
  var pwd = document.getElementById('pwd').value;
  if (!account || !pwd) { document.getElementById('msg').innerText = '请输入账号和密码'; return; }
  fetch('/entry/gate/passport/verify', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({account: account, pwd: pwd})
  }).then(function(r){ return r.json(); }).then(function(res){
    if (res.code === 0) {
      localStorage.setItem('ys_token', res.data.token);
      localStorage.setItem('ys_nickname', res.data.nickname);
      showPanel(res.data);
    } else {
      document.getElementById('msg').innerText = res.msg || '登录失败';
    }
  }).catch(function(){ document.getElementById('msg').innerText = '服务连接失败'; });
}
function showPanel(data) {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  document.getElementById('nickname').innerText = data.nickname;
  document.getElementById('tokenBox').innerText = 'Authorization: ' + data.token;
}
function logout() {
  localStorage.removeItem('ys_token');
  localStorage.removeItem('ys_nickname');
  document.getElementById('panel').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('pwd').value = '';
}
var saved = localStorage.getItem('ys_token');
if (saved) { showPanel({nickname: localStorage.getItem('ys_nickname') || '', token: saved}); }
document.addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
